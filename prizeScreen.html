<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>121Shoes · 抽奖大屏</title>
<style>
/* ==========================================================
   121Shoes 抽奖大屏 · 红金喜庆主题
   单文件 · 零依赖 · 离线可跑 · 双击打开
   ========================================================== */
:root{
  --accent:#FF5A3C;
  --accent-rgb:255,90,60;
  --cyan:#FF5A3C;
  --cyan-soft:rgba(255,90,60,.45);
  --navy-deep:#120305;
  --navy:#2A080A;
  --navy-light:#5A1214;
  --gold:#FFC24B;
  --gold-soft:#FFE6A6;
  --text:#FFF3EA;
  --text-dim:rgba(255,243,234,.55);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden}
body{
  font-family:'Segoe UI','PingFang SC','Microsoft YaHei',system-ui,sans-serif;
  background:
    radial-gradient(ellipse 98% 60% at 50% -10%, #FFEF9E 0%, #FFD24E 12%, #FFA62E 28%, rgba(255,110,40,0) 60%),
    radial-gradient(ellipse 76% 48% at 50% 38%, rgba(255,150,70,.28) 0%, rgba(255,110,50,0) 76%),
    radial-gradient(ellipse 150% 120% at 50% 64%, #F42A2A 0%, #DA1421 32%, #B00E1E 62%, #830715 100%);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
  user-select:none;
  cursor:default;
  background-image: url('bg1.jpg');
  background-size: 100% 100%;  
}
canvas{position:fixed;inset:0;display:block}
#bgCanvas{z-index:0}
#fwCanvas{z-index:1;pointer-events:none}
#fxCanvas{z-index:8;pointer-events:none}

/* ---------- 舞台层：顶部投光 / 宽幅光锥 / 底部光池 ---------- */
.stage{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:1}

/* 顶部光源带：藏着所有光锥的起点 */
.top-glow{
  position:absolute;left:50%;top:calc(-16vh - 500px);
  width:82vw;height:36vh;transform:translateX(-50%);
  background:radial-gradient(ellipse at 50% 52%,
    rgba(255,246,232,.80) 0%,
    rgba(255,196,120,.42) 30%,
    rgba(255,110,70,.16) 60%,
    rgba(220,60,40,0) 82%);
  filter:blur(20px);
  animation:topGlowPulse 7s ease-in-out infinite;
}
@keyframes topGlowPulse{
  0%,100%{opacity:.72;transform:translateX(-50%) scaleX(1)}
  50%{opacity:1;transform:translateX(-50%) scaleX(1.06)}
}

/* 宽幅光锥 */
.beams{position:absolute;inset:0;overflow:hidden}
.beam{
  position:absolute;top:calc(-10% - 500px);left:calc(50% + var(--dx, 0vw));
  width:var(--w);height:calc(128% + 500px);
  margin-left:calc(var(--w) / -2);
  transform-origin:50% 0;
  transform:rotate(var(--a));
  background:linear-gradient(to bottom,
    rgba(255,244,228,.68) 0%,
    rgba(255,190,130,.42) 15%,
    rgba(255,120,80,.20) 40%,
    rgba(230,70,45,.07) 64%,
    rgba(200,50,35,0) 88%);
  clip-path:polygon(46.5% 0,53.5% 0,100% 100%,0 100%);
  filter:blur(16px);
  mix-blend-mode:screen;
  animation:beamBreathe ease-in-out infinite;
}
@keyframes beamBreathe{
  0%,100%{opacity:calc(var(--o) * .62)}
  50%{opacity:var(--o)}
}

/* 底部光池 */
.pool{
  position:absolute;left:50%;bottom:5vh;transform:translateX(-50%);
  width:66vw;height:16vh;
  background:radial-gradient(ellipse at 50% 50%,
    rgba(255,222,150,.62) 0%,
    rgba(255,120,70,.28) 36%,
    rgba(220,60,40,.08) 64%,
    transparent 84%);
  filter:blur(10px);
  animation:poolPulse 5s ease-in-out infinite;
}
@keyframes poolPulse{
  0%,100%{opacity:.68;transform:translateX(-50%) scale(.97)}
  50%{opacity:1;transform:translateX(-50%) scale(1.03)}
}

/* 水波光晕：缓慢漂移的柔光斑 */
.caustics{position:absolute;inset:0;overflow:hidden;mix-blend-mode:screen}
.caustic{
  position:absolute;border-radius:50%;
  background:radial-gradient(circle,
    rgba(255,214,140,.30) 0%,
    rgba(255,130,80,.14) 42%,
    rgba(220,70,45,0) 72%);
  filter:blur(18px);
  animation:causticDrift ease-in-out infinite;
}
@keyframes causticDrift{
  0%,100%{transform:translate(0,0) scale(1);opacity:.32}
  50%{transform:translate(var(--dx),var(--dy)) scale(1.25);opacity:.82}
}

/* ---------- 暗角 / 扫描线 ---------- */
.vignette{
  position:fixed;inset:0;pointer-events:none;z-index:3;
  background:radial-gradient(ellipse 92% 82% at 50% 40%,transparent 62%,rgba(118,6,16,.42) 100%);
}
.scanlines{
  position:fixed;inset:0;pointer-events:none;z-index:4;opacity:.18;
  background:repeating-linear-gradient(to bottom,rgba(255,210,170,.06) 0 1px,transparent 1px 4px);
}

/* ---------- 底部同心光环 ---------- */
.rings{position:fixed;left:50%;bottom:-16vh;transform:translateX(-50%);width:110vw;height:48vh;pointer-events:none;z-index:1}
.ring{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  border-radius:50%;border:1px solid rgba(var(--accent-rgb),.55);
  box-shadow:0 0 34px rgba(var(--accent-rgb),.40),inset 0 0 34px rgba(var(--accent-rgb),.20);
  animation:ringPulse 4.5s ease-in-out infinite;
}
.ring:nth-child(1){width:26%;height:13%;animation-delay:0s}
.ring:nth-child(2){width:44%;height:22%;animation-delay:-1.1s}
.ring:nth-child(3){width:62%;height:31%;animation-delay:-2.2s}
.ring:nth-child(4){width:82%;height:41%;animation-delay:-3.3s}
@keyframes ringPulse{
  0%,100%{opacity:.22;transform:translate(-50%,-50%) scale(1)}
  50%{opacity:.75;transform:translate(-50%,-50%) scale(1.035)}
}

/* ---------- 顶部标题 ---------- */
.hud-top{
  position:fixed;top:22px;left:50%;transform:translateX(-50%);
  text-align:center;z-index:6;pointer-events:none;width:max-content;
}
.hud-top h1{
  font-size:clamp(20px,1.85vw,30px);
  font-weight:800;letter-spacing:.14em;
  background:linear-gradient(180deg,#FFFFFF,#FFD9A8 55%,var(--gold));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  text-shadow:0 0 26px rgba(var(--accent-rgb),.45);
  white-space:nowrap;
}
.hud-top .sub{
  margin-top:8px;font-size:12px;letter-spacing:.22em;color:var(--text-dim);
}
.hud-top .line{
  margin:10px auto 0;width:240px;height:1px;
  background:linear-gradient(90deg,transparent,rgba(var(--accent-rgb),.75),transparent);
}

/* ---------- 侧栏面板（参考图风格） ---------- */
.hud{
  background:linear-gradient(180deg,rgba(255,250,230,.96),rgba(250,232,178,.92));
  border:2px solid #E6B840;
  border-radius:12px;
  box-shadow:0 0 28px rgba(230,180,60,.45),inset 0 0 0 1px rgba(255,255,255,.55);
  overflow:hidden;
  z-index:6;
}
.hud-title{
  display:flex;align-items:center;gap:8px;
  font-size:13px;letter-spacing:.12em;color:#FFF5D6;
  padding:10px 14px;border-bottom:none;
  font-weight:800;text-transform:uppercase;
  background:linear-gradient(180deg,#D91C1C 0%,#B01414 55%,#8F0F0F 100%);
  text-shadow:0 1px 0 rgba(0,0,0,.35),0 0 12px rgba(255,120,60,.35);
  border-radius:10px 10px 0 0;
  box-shadow:0 2px 0 rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.12);
}
.hud-title .hud-icon{font-size:15px;line-height:1}
.hud-title .hud-sub{
  flex:1;text-align:right;font-size:9.5px;letter-spacing:.08em;
  color:rgba(255,245,214,.65);text-transform:none;font-weight:500;text-shadow:none;
}
.hud-left{
  position:fixed;left:22px;top:50%;transform:translateY(-50%);
  width:258px;max-height:360px;display:flex;flex-direction:column;
}
.hud-right{
  position:fixed;right:22px;top:50%;transform:translateY(-50%);
  width:268px;max-height:360px;display:flex;flex-direction:column;
}
/* 中奖订单滚动区 */
.feed{
  height:52vh;overflow:hidden;padding:8px;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 24px,#000 calc(100% - 24px),transparent 100%);
  mask-image:linear-gradient(to bottom,transparent 0,#000 24px,#000 calc(100% - 24px),transparent 100%);
}
.f-item{
  display:flex;align-items:center;gap:7px;
  padding:6px 8px;border-radius:6px;font-size:12.5px;line-height:1.25;
  white-space:nowrap;
}
.f-item+.f-item{margin-top:3px}
.f-item.in{animation:wIn .5s cubic-bezier(.2,.9,.25,1);background:rgba(217,28,28,.10)}
.f-item .fo{
  flex:0 0 auto;font-weight:800;color:#C9302A;
  font-variant-numeric:tabular-nums;letter-spacing:.02em;
}
.f-item .fp{flex:1;overflow:hidden;text-overflow:ellipsis;color:rgba(60,30,10,.85)}
.f-item .fl{
  flex:0 0 auto;font-size:9.5px;letter-spacing:.04em;
  padding:2px 5px;border-radius:3px;
  background:linear-gradient(180deg,#D91C1C,#B01414);color:#FFF5D6;font-weight:700;
}
.feed-empty{padding:16px 10px;text-align:center;font-size:11.5px;color:rgba(60,30,10,.42)}

/* 中奖条目 */
.w-item{padding:7px 9px;border-bottom:1px dashed rgba(200,140,40,.28);font-size:12px}
.w-item.in{animation:wIn .5s cubic-bezier(.2,.9,.25,1);background:rgba(217,28,28,.10)}
@keyframes wIn{
  from{opacity:0;transform:translateX(16px) scale(.94)}
  to{opacity:1;transform:none}
}
.w-item:last-child{border-bottom:none}
.w-item .wn{font-weight:700;color:#C9302A;font-size:12.5px}
.w-item .wg{font-size:10.5px;color:rgba(60,30,10,.62);margin-top:2px;display: none;}
.w-empty{padding:16px 10px;text-align:center;font-size:11.5px;color:rgba(60,30,10,.42)}

/* 右侧 list 默认 padding */
.hud-right .list{overflow-y:auto;padding:8px}

/* ---------- 订单号老虎机展示框 ---------- */
.slot-wrap{
  position:fixed;left:50%;top:57%;transform:translate(-50%,50%);
  z-index:7;text-align:center;pointer-events:none;
  width:clamp(320px,32vw,520px);
}
.slot-box{
  position:relative;
  margin:0 auto;
  padding:22px 32px;
  border-radius:14px;
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);  
  transition:border-color .4s ease,box-shadow .4s ease;
}
.slot-prompt{
  font-size:clamp(18px,2.4vw,60px);
  font-weight:800;letter-spacing:.24em;
  color:#921010;
  text-shadow:0 0 20px rgba(255,200,100,.4),0 2px 0 rgba(0,0,0,.25);
  padding:0px 14px;
  margin-top:-10px;
  text-align:center;
  animation:promptPulse 2.4s ease-in-out infinite;
}
@keyframes promptPulse{
  0%,100%{opacity:.6}
  50%{opacity:1}
}
.slot-box.winning{
  border-color:rgba(240,215,122,.95);
  box-shadow:0 0 50px rgba(255,220,120,.45),inset 0 0 0 1px rgba(240,215,122,.3);
  animation:slotWinPulse 1.0s ease-in-out infinite;
}
@keyframes slotWinPulse{
  0%,100%{box-shadow:0 0 40px rgba(255,220,120,.45),inset 0 0 0 1px rgba(240,215,122,.3)}
  50%{box-shadow:0 0 80px rgba(255,240,150,.8),inset 0 0 0 1px rgba(255,240,150,.6)}
}

/* 订单号滚动区 */
.order-area{
  display:flex;align-items:center;justify-content:center;gap:2px;
  font-family:'Segoe UI','PingFang SC',monospace,sans-serif;
}
.order-area .hash{
  font-size:clamp(26px,2.6vw,42px);
  font-weight:800;color:#8a0b0c;
  text-shadow:0 2px 0 rgba(0,0,0,.2),0 0 22px rgba(255,200,80,.45);
  letter-spacing:.03em;
}
.digit{
  width:clamp(22px,2.1vw,34px);height:clamp(36px,3.5vw,56px);
  overflow:hidden;display:flex;align-items:center;justify-content:center;
  position:relative;
  border-radius:4px;
  background:rgba(255 255 255 / .34%);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.14),0 2px 0 rgba(0,0,0,.2);
}
.digit-inner{
  display:flex;flex-direction:column;
  font-size:clamp(26px,2.6vw,42px);font-weight:800;
  color:#8a0b0c;line-height:1;
  text-shadow:0 2px 0 rgba(0,0,0,.2),0 0 22px rgba(255,200,80,.45);
  will-change:transform;
}
.digit-inner span{display:block;height:1em}
.digit.locked .digit-inner{animation:digitFlash .5s ease-out}
@keyframes digitFlash{
  0%{transform:scale(1);filter:brightness(1)}
  35%{transform:scale(1.25);filter:brightness(2.2) drop-shadow(0 0 18px #FFF4B0)}
  100%{transform:scale(1);filter:brightness(1)}
}

/* ---------- 中奖排行榜单 overlay ---------- */
.rank-overlay{
  position:fixed;inset:0;z-index:1000;
  background:rgba(0,0,0,.6);
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  display:none;align-items:center;justify-content:center;
  animation:rankFadeIn .3s ease;
}
.rank-overlay.open{display:flex}
@keyframes rankFadeIn{from{opacity:0}to{opacity:1}}
.rank-panel{
  width:min(86vw,920px);max-height:84vh;
  border-radius:14px;overflow:hidden;
  background:linear-gradient(179deg, #9b5704, #371100);
  border:1px solid rgba(255,200,100,.3);
  box-shadow:0 0 50px rgba(255,150,60,.25),inset 0 0 0 1px rgba(255,255,255,.04);
  display:flex;flex-direction:column;
  animation:rankPanelIn .45s cubic-bezier(.2,.9,.25,1);
}
@keyframes rankPanelIn{
  from{opacity:0;transform:scale(.94) translateY(20px)}
  to{opacity:1;transform:none}
}
.rank-head{
  padding:20px 28px 14px;
  border-bottom:1px solid rgba(255,200,100,.25);
  display:flex;align-items:center;justify-content:space-between;
}
.rank-head h2{
  font-size:clamp(18px,1.6vw,24px);font-weight:800;letter-spacing:.12em;
  background:linear-gradient(180deg,#FFFFFF,#FFD9A8 55%,var(--gold));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
}
.rank-head .rank-close{
  padding:5px 12px;border-radius:5px;background:rgba(255,255,255,.06);
  color:rgba(255,255,255,.7);font-size:12px;cursor:pointer;
  border:1px solid rgba(255,255,255,.15);
}
.rank-head .rank-close:hover{background:rgba(255,255,255,.14)}
.rank-body{overflow-y:auto;padding:20px 28px 28px}

/* 每个奖项分组 */
.rank-group{
  margin-bottom:22px;padding-bottom:18px;
  border-bottom:1px dashed rgba(255,200,100,.2);
}
.rank-group:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
.rank-ghead{
  display:flex;align-items:center;gap:10px;margin-bottom:12px;
}
.rank-glevel{
  font-size:11px;font-weight:800;letter-spacing:.12em;
  padding:3px 9px;border-radius:4px;
  background:linear-gradient(180deg,#F0D77A,#C9A227);
  color:#20180A;
}
.rank-gname{
  font-size:clamp(14px,1.2vw,17px);font-weight:700;color:#FFE9A8;
  letter-spacing:.04em;
}
.rank-gcount{
  font-size:11px;color:rgba(255,255,255,.5);letter-spacing:.08em;
}

.rank-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));
  gap:8px;
}
.rank-item{
  display:flex;align-items:center;gap:8px;
  padding:8px 10px;border-radius:6px;
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,200,100,.14);
  transition:background .2s ease,border-color .2s ease;
  font-size:12px;
}
.rank-item:hover{background:rgba(255,200,100,.08);border-color:rgba(255,200,100,.35)}
.rank-ri{
  width:20px;height:20px;flex:0 0 auto;border-radius:50%;
  background:linear-gradient(135deg,#FFD9A8,#C9A227);color:#20180A;
  font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;
}
.rank-rorder{
  flex:0 0 auto;color:#FFE9A8;font-weight:700;letter-spacing:.03em;
  font-variant-numeric:tabular-nums;
}
.rank-rprize{
  flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  color:rgba(255,255,255,.6);font-size:11px;
}

/* ---------- 底部操作栏 ---------- */
.controls{
  position:fixed;bottom:16px;left:50%;transform:translateX(-50%);
  display:flex;align-items:center;gap:9px;flex-wrap:wrap;justify-content:center;
  padding:9px 13px;border-radius:12px;z-index:9;max-width:calc(100vw - 40px);
  background:rgba(40,7,8,.88);
  border:1px solid rgba(var(--accent-rgb),.24);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:0 0 32px rgba(var(--accent-rgb),.14);
}
.controls select{
  background:rgba(18,3,4,.88);color:var(--text);
  border:1px solid rgba(var(--accent-rgb),.30);border-radius:6px;
  padding:8px 10px;font-size:12.5px;font-family:inherit;outline:none;cursor:pointer;
  max-width:290px;
}
.controls select:focus{border-color:var(--cyan)}
.btn{
  padding:9px 16px;border-radius:6px;border:1px solid rgba(var(--accent-rgb),.32);
  background:rgba(var(--accent-rgb),.08);color:#FFD9A8;
  font-size:12.5px;font-weight:600;font-family:inherit;letter-spacing:.03em;
  cursor:pointer;transition:all .16s ease;white-space:nowrap;
}
.btn:hover:not(:disabled){background:rgba(var(--accent-rgb),.18);border-color:var(--cyan);box-shadow:0 0 16px rgba(var(--accent-rgb),.3)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{opacity:.38;cursor:not-allowed}
.btn-gold{
  background:linear-gradient(180deg,#F0D77A,#C9A227);
  color:#20180A;border-color:rgba(240,215,122,.9);
  box-shadow:0 0 20px rgba(212,175,55,.42);font-weight:800;letter-spacing:.06em;
}
.btn-gold:hover:not(:disabled){background:linear-gradient(180deg,#FFE68F,#D9B233);box-shadow:0 0 30px rgba(240,215,122,.6)}
.btn-ghost{background:transparent;border-color:rgba(232,244,255,.20);color:rgba(232,244,255,.62)}
.ctrl-status{
  font-size:11.5px;color:rgba(var(--accent-rgb),.80);letter-spacing:.04em;
  max-width:330px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  padding-left:4px;
}

/* ---------- 滚动条 ---------- */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(var(--accent-rgb),.28);border-radius:9px}
::-webkit-scrollbar-thumb:hover{background:rgba(var(--accent-rgb),.5)}

/* ---------- 小屏适配 ---------- */
@media (max-width:1280px){
  .hud-left{width:196px}
  .hud-right{width:210px}
  .f-item{font-size:11.5px;padding:5px 7px}
}
@media (max-width:980px){
  .hud-left,.hud-right{display:none}
}
</style>
</head>
<body>

<!-- 背景层 -->
<canvas id="bgCanvas"></canvas>
<!-- 舞台层：顶部投光 / 宽幅光锥 / 底部光池 -->
<div class="stage">
  <div class="top-glow"></div>
  <div class="beams" id="beams"></div>
  <div class="caustics" id="caustics"></div>
  <div class="pool"></div>
  <div class="core-glow"></div>
</div>
<!-- 礼花层：两侧向球体放烟花 -->
<canvas id="fwCanvas"></canvas>
<div class="rings">
  <div class="ring"></div><div class="ring"></div><div class="ring"></div><div class="ring"></div>
</div>
<div class="vignette"></div>
<div class="scanlines"></div>

<!-- 金色粒子 -->
<canvas id="fxCanvas"></canvas>

<!-- 顶部标题 -->
<header class="hud-top">
  <h1 id="campaignTitle">121SHOES 抽奖盛典</h1>
  <div class="sub" id="campaignSub">每位顾客限中一个实物奖 · 参与奖人人有份</div>
  <div class="line"></div>
</header>

<!-- 左侧：中奖订单实时滚动 -->
<aside class="hud hud-left">
  <div class="hud-title"><span class="hud-icon">🎁</span>中奖订单奖品信息</div>
  <div class="feed" id="feedList"><div class="feed-empty">尚未产生中奖订单</div></div>
</aside>

<!-- 订单号老虎机 -->
<div class="slot-wrap" id="slotWrap">
  <div class="slot-box" id="slotBox">
    <div class="slot-prompt" id="slotPrompt">准备抽奖</div>
    <div class="order-area" id="orderArea" style="display:none"></div>
  </div>
</div>

<!-- 中奖排行榜单（全部完成后可打开） -->
<div class="rank-overlay" id="rankOverlay">

// 字符串哈希（用于头像配色，保证同名同色）
function hashStr(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}

// mulberry32 伪随机数生成器：同一种子 → 同一结果
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

// Fisher-Yates 洗牌
function shuffle(rng, arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// 姓名首字母：Emily Chen → EC

  const parts = String(name).trim().split(/\s+/);
  if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
  return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
}

}

// 候选池：参与奖不受互斥限制；实物奖排除已在其他组中奖的人
function getCandidates(group) {
  if (group.participation) return PARTICIPANTS.slice();

  const excluded = new Set();
  for (const [gid, rec] of Object.entries(STATE.drawn)) {
    const g = CONFIG.prizeGroups.find(x => x.id === gid);
    if (g && !g.participation) rec.winners.forEach(id => excluded.add(id));
  }
  return PARTICIPANTS.filter(p => !excluded.has(p.id));
}

// 计算中奖者：内定 > 参与奖全员 > 种子随机
function computeWinners(group, seed, pool) {
  // 内定优先
  if (group.preset) {
    const p = PARTICIPANTS.find(x =>
      x.name === group.preset || x.id === group.preset || x.email === group.preset);
    if (p) return [p.id];
    console.warn('内定人不在名单中：', group.preset);
  }
  // 参与奖：全员
  if (group.participation) return pool.map(p => p.id);
  // 正常随机
  const rng = mulberry32(seed);
  const arr = pool.slice();
  shuffle(rng, arr);
  return arr.slice(0, Math.min(group.quota, arr.length)).map(p => p.id);
}

   ============================================================ */

const PALETTE = [
  ['#A8181E', '#FF6B4A'],
  ['#8A1230', '#FF7B8A'],
  ['#B34700', '#FFB347'],
  ['#8C6A10', '#FFD469'],
  ['#7A1A0E', '#FF8A5C'],
  ['#A3300F', '#FFC08A']
];
const SPRITES = new Map();

function getSprite(p) {
  let s = SPRITES.get(p.id);
  if (s) return s;

  const S = 128;
  const cv = document.createElement('canvas');
  cv.width = cv.height = S;
  const g = cv.getContext('2d');
  const [c1, c2] = PALETTE[hashStr(p.name) % PALETTE.length];

  // 圆形渐变底
  const grad = g.createLinearGradient(0, 0, S, S);
  grad.addColorStop(0, c1);
  grad.addColorStop(1, c2);
  g.beginPath(); g.arc(S / 2, S / 2, S / 2 - 5, 0, Math.PI * 2);
  g.fillStyle = grad; g.fill();

  // 内高光
  const hi = g.createRadialGradient(S * 0.36, S * 0.30, 4, S / 2, S / 2, S / 2);
  hi.addColorStop(0, 'rgba(255,255,255,.45)');
  hi.addColorStop(0.55, 'rgba(255,255,255,0)');
  g.beginPath(); g.arc(S / 2, S / 2, S / 2 - 5, 0, Math.PI * 2);
  g.fillStyle = hi; g.fill();

  // 订单号（自动缩放以完整放进圆内）
  const txt = String(p.order || p.name || '');
  let fs = 40;
  const fontOf = n => '700 ' + n + 'px "Segoe UI","PingFang SC",sans-serif';
  g.font = fontOf(fs);
  while (fs > 11 && g.measureText(txt).width > S * 0.74) {
    fs -= 1;
    g.font = fontOf(fs);
  }
  g.fillStyle = '#FFFFFF';
  g.textAlign = 'center';
  g.textBaseline = 'middle';
  g.fillText(txt, S / 2, S / 2 + 2);

  SPRITES.set(p.id, cv);
  return cv;
}

  const w = window.innerWidth, h = window.innerHeight;
  [[$('bgCanvas'), BGC], [$('fxCanvas'), FXC], [$('fwCanvas'), FWC]].forEach(([cv, box]) => {
    cv.width = Math.round(w * dpr);
    cv.height = Math.round(h * dpr);
    cv.style.width = w + 'px';
    cv.style.height = h + 'px';
    const ctx = cv.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    box.ctx = ctx; box.w = w; box.h = h;
  });
}

// 上升的浮游光点
const motes = Array.from({ length: 46 }, () => ({
  x: Math.random(), y: Math.random(),
  r: Math.random() * 1.8 + 0.6,
  sp: 0.02 + Math.random() * 0.06,
  drift: (Math.random() * 2 - 1) * 1.6,
  a: 0.15 + Math.random() * 0.45
}));

function renderBG(t, dt) {
  const { ctx: c, w, h } = BGC;
  c.clearRect(0, 0, w, h);

  // 1) 星云
  for (const nb of nebulas) {
    const px = (nb.x + Math.sin(t * nb.sp + nb.ph) * nb.amp) * w;
    const py = (nb.y + Math.cos(t * nb.sp * 1.3 + nb.ph) * nb.amp * 0.8) * h;
    const rad = nb.r * Math.min(w, h) * 0.9;
    const g = c.createRadialGradient(px, py, 0, px, py, rad);
    g.addColorStop(0, 'rgba(' + nb.c + ',' + nb.a + ')');
    g.addColorStop(0.5, 'rgba(' + nb.c + ',' + (nb.a * 0.35).toFixed(3) + ')');
    g.addColorStop(1, 'rgba(' + nb.c + ',0)');
    c.fillStyle = g;
    c.fillRect(0, 0, w, h);
  }

  // 2) 闪烁星点
  c.fillStyle = '#FFD9A8';
  for (const s of stars) {
    const a = 0.18 + 0.62 * Math.abs(Math.sin(t * 0.001 * s.sp + s.ph));
    c.globalAlpha = a;
    c.beginPath();
    c.arc(s.x * w, s.y * h, s.r, 0, Math.PI * 2);
    c.fill();
  }

  // 3) 四角星光
  for (const s of sparkles) {
    const a = Math.pow(Math.abs(Math.sin(t * 0.0016 * s.sp + s.ph)), 3);
    if (a < 0.06) continue;
    const L = s.len * (0.55 + a * 0.9);
    const px = s.x * w, py = s.y * h;

    const gv = c.createLinearGradient(0, -L, 0, L);
    gv.addColorStop(0, 'rgba(255,255,255,0)');
    gv.addColorStop(0.5, 'rgba(225,247,255,.95)');
    gv.addColorStop(1, 'rgba(255,255,255,0)');
    const gh = c.createLinearGradient(-L, 0, L, 0);
    gh.addColorStop(0, 'rgba(255,255,255,0)');
    gh.addColorStop(0.5, 'rgba(225,247,255,.95)');
    gh.addColorStop(1, 'rgba(255,255,255,0)');

    c.globalAlpha = a;
    c.fillStyle = gv;
    c.fillRect(px - 0.9, py - L, 1.8, L * 2);
    c.fillStyle = gh;
    c.fillRect(px - L, py - 0.9, L * 2, 1.8);
  }

  // 4) 上升浮游光点
  for (const m of motes) {
    m.y -= m.sp * dt;
    m.x += m.drift * dt * 0.01;
    if (m.y < -0.04) { m.y = 1.04; m.x = Math.random(); }
    if (m.x < -0.04) m.x = 1.04;
    if (m.x > 1.04) m.x = -0.04;

    c.globalAlpha = m.a * (0.5 + 0.5 * Math.sin(t * 0.002 + m.x * 10));
    c.fillStyle = '#FFE0B0';
    c.beginPath();
    c.arc(m.x * w, m.y * h, m.r, 0, Math.PI * 2);
    c.fill();
  }

  c.globalAlpha = 1;
}

const particles = [];

function burst(n) {
  const cx = window.innerWidth / 2;
  const cy = window.innerHeight * 0.455;
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const v = 1.8 + Math.random() * 7.5;
    particles.push({
      x: cx, y: cy,
      vx: Math.cos(a) * v,
      vy: Math.sin(a) * v - 1.8,
      life: 1,
      size: 1 + Math.random() * 2.6,
      col: Math.random() < 0.5 ? '#F0D77A' : '#D4AF37'
    });
  }
}

/* ============================================================
   ⑨ 两侧礼花：从画面左右边缘射向球体，在球体两侧炸开
   ============================================================ */

const FW_COLORS = ['#FFD86B', '#FFB03A', '#FF8A3D', '#FF5A3C', '#FFF2C9', '#FFE9A8'];
const fwRockets = [];
const fwSparks = [];
let fwNext = 0;

function launchRocket(side) {
  const { w, h } = FWC;
  const fromLeft = side === 'left';
  const sx = fromLeft ? -w * 0.03 : w * 1.03;
  const sy = h * (0.34 + Math.random() * 0.58);

  // 爆炸点固定在屏幕左右两侧区域内
  const tx = fromLeft ? w * (0.05 + Math.random() * 0.20)
                      : w * (0.75 + Math.random() * 0.20);
  const ty = h * (0.18 + Math.random() * 0.56);

  fwRockets.push({
    sx, sy, tx, ty, x: sx, y: sy,
    t0: performance.now(),
    dur: 800 + Math.random() * 550
  });
}

// 只从左右两侧发射
function pickSide() {
  return Math.random() < 0.5 ? 'left' : 'right';
}

function explodeFW(x, y) {
  const n = 80 + Math.floor(Math.random() * 40);
  const base = FW_COLORS[(Math.random() * FW_COLORS.length) | 0];
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = 1.8 + Math.random() * 1.4;
    const life = 1.1 + Math.random() * 0.8;
    fwSparks.push({
      x, y,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp,
      life, max: life,
      size: 1.6 + Math.random() * 2.2,
      col: Math.random() < 0.72 ? base : FW_COLORS[(Math.random() * FW_COLORS.length) | 0]
    });
  }
  // 爆炸瞬间的中心闪光
  fwSparks.push({ x, y, vx: 0, vy: 0, life: 0.3, max: 0.3, size: 24, col: '#FFF6DC' });
}

/* 漂浮元素：透明气泡（大小随机）+ 金币 + 礼物盒，集中在屏幕两侧 */
const fwProps = [];
let fwPropNext = 0;

function spawnProp() {
  const { w, h } = FWC;
  // 八成集中在左右两侧
  let x;
  if (Math.random() < 0.84) {
    x = Math.random() < 0.5
      ? w * (0.00 + Math.random() * 0.26)
      : w * (0.74 + Math.random() * 0.26);
  } else {
    x = w * (0.20 + Math.random() * 0.60);
  }

  // 气泡 62% / 金币 22% / 礼物 16%
  const roll = Math.random();
  const kind = roll < 0.62 ? 'bubble' : (roll < 0.84 ? 'coin' : 'gift');

  // 气泡半径 16-56（直径 32-112），金币、礼物略小
  const r = kind === 'bubble'
    ? 16 + Math.random() * 40
    : 11 + Math.random() * 11;

  fwProps.push({
    kind, x, r,
    y: h * (1.04 + Math.random() * 0.30),
    vy: (kind === 'bubble' ? 0.32 : 0.45) + Math.random() * 0.62,
    ph: Math.random() * Math.PI * 2,
    sp: 0.008 + Math.random() * 0.016,
    amp: 0.4 + Math.random() * 1.6,
    spin: Math.random() * Math.PI * 2,
    spinSp: (0.015 + Math.random() * 0.035) * (Math.random() < 0.5 ? -1 : 1),
    hue: Math.random() * 360
  });
}

/* 透明气泡 */
function drawBubble(c, p) {
  const r = p.r;
  const hue = (p.hue + p.spin * 30) % 360;

  // 泡体：几乎透明，只在边缘泛一点彩虹色
  const g = c.createRadialGradient(-r * 0.3, -r * 0.3, r * 0.05, 0, 0, r);
  g.addColorStop(0, 'rgba(255,255,255,.30)');
  g.addColorStop(0.45, 'hsla(' + hue + ',100%,80%,.07)');
  g.addColorStop(0.82, 'hsla(' + ((hue + 70) % 360) + ',100%,74%,.14)');
  g.addColorStop(1, 'rgba(255,255,255,.04)');
  c.beginPath();
  c.arc(0, 0, r, 0, Math.PI * 2);
  c.fillStyle = g;
  c.fill();

  c.lineWidth = 1.4;
  c.strokeStyle = 'hsla(' + hue + ',100%,84%,.52)';
  c.stroke();

  // 左上加一点高光，右下加一点反光
  c.beginPath();
  c.arc(-r * 0.34, -r * 0.36, r * 0.17, 0, Math.PI * 2);
  c.fillStyle = 'rgba(255,255,255,.62)';
  c.fill();
  c.beginPath();
  c.arc(r * 0.28, r * 0.34, r * 0.09, 0, Math.PI * 2);
  c.fillStyle = 'rgba(255,255,255,.28)';
  c.fill();
}

/* 金币：绕竖轴翻转 */
function drawCoin(c, p) {
  const r = p.r;
  const sx = 0.3 + 0.7 * Math.abs(Math.cos(p.spin));
  c.scale(sx, 1);

  const g = c.createRadialGradient(-r * 0.35, -r * 0.4, r * 0.1, 0, 0, r);
  g.addColorStop(0, '#FFF8D4');
  g.addColorStop(0.45, '#FFD24A');
  g.addColorStop(0.82, '#E8A21C');
  g.addColorStop(1, '#B9760B');
  c.beginPath();
  c.arc(0, 0, r, 0, Math.PI * 2);
  c.fillStyle = g;
  c.fill();
  c.lineWidth = Math.max(1, r * 0.1);
  c.strokeStyle = 'rgba(255,244,190,.8)';
  c.stroke();

  c.beginPath();
  c.arc(0, 0, r * 0.66, 0, Math.PI * 2);
  c.lineWidth = Math.max(0.8, r * 0.07);
  c.strokeStyle = 'rgba(160,96,10,.45)';
  c.stroke();

  // 中间星芒
  c.beginPath();
  for (let k = 0; k < 10; k++) {
    const rr = k % 2 ? r * 0.15 : r * 0.40;
    const a = -Math.PI / 2 + k * Math.PI / 5;
    const px = Math.cos(a) * rr, py = Math.sin(a) * rr;
    k ? c.lineTo(px, py) : c.moveTo(px, py);
  }
  c.closePath();
  c.fillStyle = 'rgba(176,112,12,.7)';
  c.fill();

  c.beginPath();
  c.ellipse(-r * 0.34, -r * 0.42, r * 0.26, r * 0.15, -0.6, 0, Math.PI * 2);
  c.fillStyle = 'rgba(255,255,255,.55)';
  c.fill();
}

/* 礼物盒：金色盒身 + 红色缎带 */
function drawGift(c, p) {
  const s = p.r;
  c.rotate(Math.sin(p.spin) * 0.22);
  const bw = s * 1.6, bh = s * 1.4, lidH = s * 0.36;

  const g = c.createLinearGradient(-bw / 2, 0, bw / 2, 0);
  g.addColorStop(0, '#FFE9A8');
  g.addColorStop(0.42, '#FFC24B');
  g.addColorStop(1, '#D98E12');
  c.fillStyle = g;
  c.fillRect(-bw / 2, -bh / 2 + lidH * 0.55, bw, bh - lidH * 0.55);
  c.fillRect(-bw / 2 - s * 0.08, -bh / 2, bw + s * 0.16, lidH);

  // 缎带
  c.fillStyle = 'rgba(226,58,43,.92)';
  c.fillRect(-s * 0.13, -bh / 2, s * 0.26, bh);
  c.fillRect(-bw / 2 - s * 0.08, -bh / 2 + lidH * 0.5, bw + s * 0.16, s * 0.22);

  // 蝴蝶结
  c.beginPath();
  c.ellipse(-s * 0.24, -bh / 2 - s * 0.12, s * 0.28, s * 0.16, -0.5, 0, Math.PI * 2);
  c.ellipse(s * 0.24, -bh / 2 - s * 0.12, s * 0.28, s * 0.16, 0.5, 0, Math.PI * 2);
  c.fillStyle = 'rgba(255,110,80,.95)';
  c.fill();
  c.beginPath();
  c.arc(0, -bh / 2 - s * 0.1, s * 0.11, 0, Math.PI * 2);
  c.fillStyle = '#FFE9A8';
  c.fill();

  // 左侧高光
  c.fillStyle = 'rgba(255,255,255,.3)';
  c.fillRect(-bw / 2 + s * 0.06, -bh / 2 + lidH * 0.6, bw * 0.22, (bh - lidH * 0.6) * 0.52);
}

function drawProps() {
  const c = FWC.ctx;
  if (!c) return;
  for (let i = fwProps.length - 1; i >= 0; i--) {
    const p = fwProps[i];
    p.ph += p.sp;
    p.x += Math.sin(p.ph) * p.amp;
    p.y -= p.vy;
    p.spin += p.spinSp;
    if (p.y < -p.r * 2.6) { fwProps.splice(i, 1); continue; }

    const fade = Math.min(1, Math.max(0, p.y / (FWC.h * 0.30)));
    c.globalAlpha = p.kind === 'bubble' ? 0.22 + fade * 0.58 : 0.34 + fade * 0.56;

    c.save();
    c.translate(p.x, p.y);
    if (p.kind === 'bubble') drawBubble(c, p);
    else if (p.kind === 'coin') drawCoin(c, p);
    else drawGift(c, p);
    c.restore();
  }
  c.globalAlpha = 1;
}

/* 四角灯光：从画面四角向内侧缓慢扫动的光锥 + 呼吸光源 */
function drawCornerLights(now) {
  const { ctx: c, w, h } = FWC;
  if (!c) return;
  const t = now * 0.0006;
  const len = Math.max(w, h) * 0.72;
  const corners = [
    { x: 0, y: 0, base: Math.PI * 0.25,  dir: 1,  ph: 0 },
    { x: w, y: 0, base: Math.PI * 0.75,  dir: -1, ph: 1.6 },
    { x: 0, y: h, base: -Math.PI * 0.25, dir: -1, ph: 3.1 },
    { x: w, y: h, base: -Math.PI * 0.75, dir: 1,  ph: 4.7 }
  ];

  corners.forEach(k => {
    const ang = k.base + Math.sin(t + k.ph) * 0.34 * k.dir;
    const spread = 0.16 + 0.05 * Math.sin(t * 1.7 + k.ph);
    const pulse = 0.65 + 0.35 * Math.sin(t * 2.2 + k.ph);

    c.save();
    c.translate(k.x, k.y);
    c.rotate(ang);

    const g = c.createRadialGradient(0, 0, 0, 0, 0, len);
    g.addColorStop(0, 'rgba(255,240,200,' + (0.55 * pulse).toFixed(3) + ')');
    g.addColorStop(0.18, 'rgba(255,200,110,' + (0.22 * pulse).toFixed(3) + ')');
    g.addColorStop(0.55, 'rgba(255,150,60,.06)');
    g.addColorStop(1, 'rgba(255,120,40,0)');

    c.beginPath();
    c.moveTo(0, 0);
    c.arc(0, 0, len, -spread, spread);
    c.closePath();
    c.fillStyle = g;
    c.fill();
    c.restore();

    // 角上的灯光源点
    const r = 26 + 12 * pulse;
    const gg = c.createRadialGradient(k.x, k.y, 0, k.x, k.y, r);
    gg.addColorStop(0, 'rgba(255,248,220,' + (0.9 * pulse).toFixed(3) + ')');
    gg.addColorStop(0.35, 'rgba(255,200,110,.35)');
    gg.addColorStop(1, 'rgba(255,150,60,0)');
    c.fillStyle = gg;
    c.beginPath();
    c.arc(k.x, k.y, r, 0, Math.PI * 2);
    c.fill();
  });
}

function renderFW(now) {
  const { ctx: c, w, h } = FWC;
  if (!c) return;

  c.clearRect(0, 0, w, h);
  c.globalCompositeOperation = 'lighter';

  // 四角灯光
  drawCornerLights(now);

  // 左右两侧密集发射
  if (now > fwNext) {
    launchRocket(pickSide());
    if (Math.random() < 0.65) launchRocket(pickSide());
    if (Math.random() < 0.4) launchRocket(pickSide());
    fwNext = now + 300 + Math.random() * 350;
  }

  // 升空的火箭 + 拖尾
  for (let i = fwRockets.length - 1; i >= 0; i--) {
    const r = fwRockets[i];
    const k = Math.min(1, (now - r.t0) / r.dur);
    const e = 1 - Math.pow(1 - k, 3);
    r.x = r.sx + (r.tx - r.sx) * e;
    r.y = r.sy + (r.ty - r.sy) * e;

    fwSparks.push({
      x: r.x + (Math.random() - 0.5) * 3,
      y: r.y + (Math.random() - 0.5) * 3,
      vx: (Math.random() - 0.5) * 0.6,
      vy: 0.2 + Math.random() * 0.5,
      life: 0.5, max: 0.5,
      size: 1 + Math.random() * 1.3,
      col: '#FFD28A'
    });

    c.globalAlpha = 1;
    c.fillStyle = '#FFF6DC';
    c.beginPath();
    c.arc(r.x, r.y, 2.6, 0, Math.PI * 2);
    c.fill();

    if (k >= 1) {
      explodeFW(r.x, r.y);
      fwRockets.splice(i, 1);
    }
  }

  // 火花
  for (let i = fwSparks.length - 1; i >= 0; i--) {
    const s = fwSparks[i];
    s.x += s.vx; s.y += s.vy;
    s.vy += 0.02;
    s.vx *= 0.987; s.vy *= 0.987;
    s.life -= 0.016;
    if (s.life <= 0) { fwSparks.splice(i, 1); continue; }
    const a = Math.max(0, s.life / s.max);
    c.globalAlpha = a;
    c.fillStyle = s.col;
    c.beginPath();
    c.arc(s.x, s.y, s.size * (0.55 + a * 0.55), 0, Math.PI * 2);
    c.fill();
  }

  // 防止长时间运行堆积
  if (fwSparks.length > 2200) fwSparks.splice(0, fwSparks.length - 2200);

  c.globalAlpha = 1;
  c.globalCompositeOperation = 'source-over';

  // 气泡 / 金币 / 礼物：两侧密集升起
  if (now > fwPropNext) {
    spawnProp();
    if (Math.random() < 0.7) spawnProp();
    if (Math.random() < 0.35) spawnProp();
    fwPropNext = now + 170 + Math.random() * 230;
  }
  if (fwProps.length > 60) fwProps.splice(0, fwProps.length - 60);
  drawProps();
}

function renderFX() {
  const { ctx: c, w, h } = FXC;
  c.clearRect(0, 0, w, h);
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy;
    p.vy += 0.19; p.vx *= 0.992;
    p.life -= 0.011;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    c.globalAlpha = Math.max(0, p.life);
    c.fillStyle = p.col;
    c.beginPath();
    c.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    c.fill();
  }
  c.globalAlpha = 1;
}

/* ============================================================
   ⑩ 主循环 + 订单号滚动
   ============================================================ */

let digitStates = [];   // 每位数字的老虎机状态
const DIGIT_HEIGHT = 1;   // 单位：em，对应 CSS 的 line-height:1

/* 驱动老虎机滚动：返回 true 表示全部锁定 */
function tickDigits(dt) {
  let allLocked = true;
  for (const d of digitStates) {
    if (d.locked) continue;
    allLocked = false;
    // 逐步减速
    if (d.speed > d.minSpeed) {
      d.speed = Math.max(d.minSpeed, d.speed - d.decay * dt);
    }
    d.y += d.speed * dt;
    const h = d.emPx * 10;   // 10 行数字
    if (d.y > h) {
      d.y -= h;   // 无限循环
    }
    d.el.style.transform = 'translateY(' + (-d.y) + 'px)';
  }
  return allLocked;
}

/* 锁定第 idx 位到数字 digit，带闪光 */
function lockDigit(idx, digit) {
  const d = digitStates[idx];
  if (!d) return;
  d.locked = true;
  d.speed = 0;
  // 把位置停在目标数字上（目标数字在数组第 digit 项，偏移 -digit*emPx）
  const targetY = digit * d.emPx;
  d.y = targetY;
  d.el.style.transform = 'translateY(' + (-targetY) + 'px)';
  d.box.classList.remove('locked');
  void d.box.offsetWidth;
  d.box.classList.add('locked');
}

let lastT = performance.now();

function loop(now) {
  const dt = Math.min(60, now - lastT) / 1000;
  lastT = now;

  renderBG(now, dt);
  renderFW(now);
  renderFX();
  tickFeed(dt);
  tickDigits(dt);

  requestAnimationFrame(loop);
}

/* ============================================================
   ⑪ 领奖台 + 订单号老虎机
   ============================================================ */

const slotBoxEl = $('slotBox');
const orderAreaEl = $('orderArea');
let busy = false;

/* 订单号格式："#12100"，digit 是 # 后的每个数字字符数组 */
function buildOrderView(orderStr) {
  // 显示老虎机，隐藏待机提示
  $('slotPrompt').style.display = 'none';
  orderAreaEl.style.display = 'flex';

  orderAreaEl.innerHTML = '';
  digitStates = [];

  // # 符号
  const hash = document.createElement('span');
  hash.className = 'hash';
  hash.textContent = '#';
  orderAreaEl.appendChild(hash);

  const digits = orderStr.replace(/^#/, '').split('');
  const emPx = parseFloat(getComputedStyle(orderAreaEl).fontSize) || 50;

  digits.forEach((digit, idx) => {
    const box = document.createElement('div');
    box.className = 'digit';
    const inner = document.createElement('div');
    inner.className = 'digit-inner';
    // 预渲染 10 个数字（0-9），每一位都一样
    for (let i = 0; i < 10; i++) {
      const s = document.createElement('span');
      s.textContent = i;
      inner.appendChild(s);
    }
    box.appendChild(inner);
    orderAreaEl.appendChild(box);

    // 初始：目标数字位置（但位置留一点偏移制造"等待开始"感）
    const startOffset = Math.floor(Math.random() * 10) * emPx;
    inner.style.transform = 'translateY(' + (-startOffset) + 'px)';

    digitStates.push({
      box,
      el: inner,
      emPx,
      locked: true,          // 初始锁定
      speed: 0,
      minSpeed: 120,
      decay: 0,              // 初始 0，开始抽奖时设
      y: startOffset,
      target: parseInt(digit, 10)
    });
  });
}

/* 让所有 digit 从当前锁定位置开始快速滚动 */
function startDigitsRolling(durationMs) {
  // durationMs 内逐步减速停止（到 minSpeed 后锁定）
  digitStates.forEach((d, i) => {
    d.locked = false;
    d.speed = 680 + Math.random() * 280;
    d.decay = (d.speed - d.minSpeed) / (durationMs / 1000);
  });
}

function stopDigitsNow() {
  digitStates.forEach(d => {
    d.locked = true;
    d.speed = 0;
    const targetY = d.target * d.emPx;
    d.y = targetY;
    d.el.style.transform = 'translateY(' + (-targetY) + 'px)';
  });
}

function setStatus(msg) {
  // 状态条已移除，保留接口兼容历史调用
}

function renderSlotIdle(promptText) {
  slotBoxEl.classList.remove('winning');
  orderAreaEl.style.display = 'none';
  const p = $('slotPrompt');
  p.style.display = 'block';
  p.textContent = promptText || '准备抽奖';
}

/* 检测"所有有名额的奖项是否都抽完了" */
function isAllDrawn() {
  return GROUPS.filter(g => g.quota > 0 || g.participation).every(g => !!STATE.drawn[g.id]);
}

/* 渲染排行榜单 overlay 内容 */
function renderRank() {
  const body = $('rankBody');
  if (!body) return;

  // 按 levelOrder 排序奖项
  const groups = GROUPS
    .filter(g => STATE.drawn[g.id] && STATE.drawn[g.id].winners.length > 0)
    .sort((a, b) => (a.levelOrder || 0) - (b.levelOrder || 0));

  if (!groups.length) {
    body.innerHTML = '<div style="text-align:center;color:rgba(255,255,255,.45);padding:60px 0">暂无中奖记录</div>';
    return;
  }

  body.innerHTML = groups.map(g => {
    const rec = STATE.drawn[g.id];
    const items = rec.winners.map((id, idx) => {
      const p = PMAP.get(id);
      if (!p) return '';
      return '<div class="rank-item">' +
        '<span class="rank-ri">' + (idx + 1) + '</span>' +
        '<span class="rank-rorder">' + p.order + '</span>' +
        '<span class="rank-rprize">' + g.name + '</span>' +
      '</div>';
    }).join('');
    return '<div class="rank-group">' +
      '<div class="rank-ghead">' +
        '<span class="rank-glevel">' + g.level.replace('等奖', '') + '</span>' +
        '<span class="rank-gname">' + g.name + '</span>' +
        '<span class="rank-gcount">共 ' + rec.winners.length + ' 人' + (g.prize ? ' · ' + g.prize : '') + '</span>' +
      '</div>' +
      '<div class="rank-grid">' + items + '</div>' +
    '</div>';
  }).join('');
}

/* 打开 / 关闭排行榜单 */
function openRank() {
  renderRank();
  $('rankOverlay').classList.add('open');
}
function closeRank() {
  $('rankOverlay').classList.remove('open');
}

/* ============================================================
   ⑫ 抽奖流程
   ============================================================ */

async function runDraw() {
  if (busy) return;

  const gid = $('groupSelect').value;
  const group = GROUPS.find(g => g.id === gid);
  if (!group) { setStatus('请先选择奖项'); return; }
  if (STATE.drawn[gid]) { setStatus('该奖项已抽过，如需重抽请先点「作废重抽」'); return; }

  const pool = getCandidates(group);
  if (pool.length === 0) { setStatus('没有可参与该奖项的候选人了'); return; }

  busy = true;
  $('drawBtn').disabled = true;
  setStatus('抽奖进行中…');

  // 生成种子并预先算好结果
  const seed = (Date.now() ^ Math.floor(Math.random() * 0xFFFFFFFF)) >>> 0;
  const winners = computeWinners(group, seed, pool);

  // 提前登记本次抽奖，中奖人将逐个实时进入右侧名单
  liveDraw = { gid: group.id, ids: [] };

  // 进入抽奖动画阶段（只做滚动，每个中奖者揭晓时再单独跑一遍老虎机）

  await revealWinners(group, winners, seed);

  // 抽奖结束，隐藏老虎机，显示完成提示
  renderSlotIdle('抽奖完成');
  busy = false;
  $('drawBtn').disabled = false;
  refreshControls();
}

async function revealWinners(group, winners, seed) {
  if (group.participation) {
    // 参与奖：全员发放 —— 随机抽取一个参与奖样本做滚动，然后显示汇总
    const sample = winners[0] ? PMAP.get(winners[0]) : null;
    if (sample) {
      await rollAndRevealDigitByDigit(sample.order);
    }
    slotBoxEl.classList.add('winning');
    burst(130);
    liveDraw.ids = winners.slice();
    renderWinners();
    renderFeed();
    await sleep(1400);
    slotBoxEl.classList.remove('winning');
  } else {
    for (let i = 0; i < winners.length; i++) {
      const p = PMAP.get(winners[i]);
      if (!p) continue;

      // 每一位中奖者：重新构造订单区 → 快速滚动 → 逐位锁定 + 礼花
      await rollAndRevealDigitByDigit(p.order);

      liveDraw.ids.push(p.id);
      renderWinners();
      renderFeed();

      slotBoxEl.classList.add('winning');
      burst(70);

      await sleep(1200);
      slotBoxEl.classList.remove('winning');
      await sleep(100);
    }
  }

  // 落库
  liveDraw = null;
  STATE.drawn[group.id] = {
    winners: winners,
    seed: seed,
    at: Date.now(),
    preset: !!group.preset && group.quota > 0,
    level: group.level,
    name: group.name,
    prize: group.prize,
    value: group.value
  };
  saveState();

  renderFeed();
  fillGroupSelect();
  renderWinners();
  refreshControls();
  setStatus(group.level + '「' + group.name + '」完成，共 ' + winners.length + ' 人 · 种子 0x' + seed.toString(16));
}

/* 老虎机滚动 → 逐位锁定数字的完整过程 */
async function rollAndRevealDigitByDigit(orderStr) {
  // 重新构造目标订单号视图（初始全部锁定在目标位置）
  buildOrderView(orderStr);

  // 让全部 digit 开始滚动
  const n = digitStates.length;
  const ROLL_MS = 1000;   // 滚动时长
  startDigitsRolling(ROLL_MS);

  // 滚动一段时间后，逐位锁定（左 → 右，每位间隔 ~260ms）
  const stagger = 150;
  // 每位的锁定时间点
  for (let i = 0; i < n; i++) {
    await sleep(stagger);
    lockDigit(i, digitStates[i].target);
  }

  // 等所有位都锁定了再返回
  await sleep(200);
}

/* ============================================================
   ⑫ 界面渲染
   ============================================================ */

/* 汇总所有已开奖订单 + 正在揭晓的订单，按开奖时间排序 */
function feedEntries() {
  const list = [];
  Object.entries(STATE.drawn)
    .map(([gid, rec]) => ({ rec, g: CONFIG.prizeGroups.find(x => x.id === gid) }))
    .filter(x => x.g)
    .sort((a, b) => (a.rec.at || 0) - (b.rec.at || 0))
    .forEach(({ rec, g }) => {
      rec.winners.forEach(id => {
        const p = PMAP.get(id);
        if (p) list.push({ order: p.order, prize: g.name, level: g.level });
      });
    });

  // 抽奖过程中的实时结果（尚未落库）
  if (liveDraw) {
    const lg = CONFIG.prizeGroups.find(x => x.id === liveDraw.gid);
    if (lg) {
      liveDraw.ids.forEach(id => {
        const p = PMAP.get(id);
        if (p) list.push({ order: p.order, prize: lg.name, level: lg.level, live: true });
      });
    }
  }
  return list;
}

let feedSig = '';

function renderFeed() {
  const box = $('feedList');
  if (!box) return;

  const items = feedEntries();
  const sig = items.length + '|' + items.map(x => x.order).join(',');
  if (sig === feedSig) return;
  feedSig = sig;

  if (!items.length) {
    box.innerHTML = '<div class="feed-empty">尚未产生中奖订单</div>';
    return;
  }

  const last = items.length - 1;
  box.innerHTML = items.map((x, i) =>
    '<div class="f-item' + (x.live && i === last ? ' in' : '') + '">' +
      '<span class="fo">' + x.order + '</span>' +
      '<span class="fp">' + x.prize + '</span>' +
      '<span class="fl">' + x.level.replace('等奖', '') + '</span>' +
    '</div>'
  ).join('');
}

/* 中奖订单缓慢自动滚动，始终追随最新一条 */
function tickFeed(dt) {
  const box = $('feedList');
  if (!box) return;
  const max = box.scrollHeight - box.clientHeight;
  if (max <= 0) return;
  if (box.scrollTop < max - 0.5) {
    box.scrollTop = Math.min(max, box.scrollTop + dt * 30);
  }
}

function renderWinners() {
  const box = $('winnersList');
  const title = $('winnersTitle');
  const gid = $('groupSelect').value;
  const g = GROUPS.find(x => x.id === gid);

  if (!g) {
    title.textContent = '中奖名单';
    box.innerHTML = '<div class="w-empty">尚未产生中奖者</div>';
    return;
  }

  // 只显示当前选中奖项的中奖人
  title.textContent = g.level + ' · ' + g.name;

  const live = liveDraw && liveDraw.gid === gid;
  const rec = live ? { winners: liveDraw.ids } : STATE.drawn[gid];
  if (!rec || !rec.winners || rec.winners.length === 0) {
    box.innerHTML = '<div class="w-empty">' + (live ? '正在抽取…' : '该奖项尚未开奖') + '</div>';
    return;
  }

  box.innerHTML = '';
  rec.winners.forEach((id, idx) => {
    const p = PMAP.get(id);
    if (!p) return;
    const el = document.createElement('div');
    el.className = 'w-item' + (live && idx === rec.winners.length - 1 ? ' in' : '');
    el.innerHTML = '<div class="wn">' + p.order + '</div>' +
                   '<div class="wg">' + g.level + ' · ' + g.name + '</div>';
    box.appendChild(el);
  });
  // 实时抽奖时自动滚动到最新一位
  if (live) box.scrollTop = box.scrollHeight;
}

function fillGroupSelect() {
  const sel = $('groupSelect');
  const cur = sel.value;
  sel.innerHTML = '';
  GROUPS.forEach(g => {
    const o = document.createElement('option');
    o.value = g.id;
    const rec = STATE.drawn[g.id];
    o.disabled = !!rec;
    o.textContent = rec
      ? '✓ 已完成 · ' + g.level + ' · ' + g.name + '（' + rec.winners.length + ' 人）'
      : g.level + ' · ' + g.name + (g.participation ? '（全员）' : '（' + g.quota + ' 名）');
    sel.appendChild(o);
  });
  // 保留原选中项（已完成的项仍可作为当前项显示，但不可再次选择）
  if (cur) sel.value = cur;
}

function refreshControls() {
  const gid = $('groupSelect').value;
  const g = GROUPS.find(x => x.id === gid);
  if (!g) return;

  $('drawBtn').disabled = !!STATE.drawn[gid];
  $('voidBtn').disabled = !STATE.drawn[gid];

  if (STATE.drawn[gid]) {
    setStatus('该奖项已完成，共 ' + STATE.drawn[gid].winners.length + ' 人');
  } else if (g.preset) {
    setStatus('⚠ 该奖项已设置内定中奖人');
  } else {
    setStatus('就绪 · 候选 ' + getCandidates(g).length + ' 人 / 名额 ' +
              (g.participation ? '全员' : g.quota));
  }
}

/* ============================================================
   ⑬ 导出 / 作废 / 重置
   ============================================================ */

function exportCSV() {
  const rows = [['姓名', '邮箱', '订单号', '奖项等级', '奖项名称', '奖品', '参考价值(£)']];

  const entries = Object.entries(STATE.drawn)
    .map(([gid, rec]) => ({ gid, rec, g: CONFIG.prizeGroups.find(x => x.id === gid) }))
    .filter(x => x.g)
    .sort((a, b) => a.g.levelOrder - b.g.levelOrder);

  entries.forEach(({ rec, g }) => {
    rec.winners.forEach(id => {
      const p = PMAP.get(id);
      if (!p) return;
      rows.push([
        p.name, p.email, p.order,
        g.level, g.name, g.prize,
        g.value == null ? '' : g.value
      ]);
    });
  });

  if (rows.length === 1) { setStatus('还没有中奖记录，无法导出'); return; }

  const csv = '\ufeff' + rows.map(r =>
    r.map(v => '"' + String(v).replace(/"/g, '""') + '"').join(',')
  ).join('\r\n');

  download(new Blob([csv], { type: 'text/csv;charset=utf-8' }),
           '121shoes-winners-' + stamp() + '.csv');
  setStatus('已导出 ' + (rows.length - 1) + ' 条中奖记录');
}

function voidCurrent() {
  const gid = $('groupSelect').value;
  if (!STATE.drawn[gid]) { setStatus('该奖项还没有抽奖记录'); return; }
  if (!confirm('确定作废该奖项的抽奖结果？作废后可重新抽取。')) return;

  delete STATE.drawn[gid];
  saveState();
  renderFeed();
  renderWinners();
  fillGroupSelect();
  $('groupSelect').value = gid;
  refreshControls();
  renderSlotIdle();
  setStatus('已作废，可重新抽取');
}

function resetAll() {
  if (!confirm('将清空所有抽奖结果（名单和奖池配置不受影响），确定继续？')) return;
  STATE = { drawn: {} };
  saveState();
  renderFeed();
  renderWinners();
  fillGroupSelect();
  refreshControls();
  renderSlotIdle();
  setStatus('已重置，可以重新开始');
}

/* ============================================================
   ⑭ 初始化
   ============================================================ */

/* 生成水波光晕 */
function buildCaustics() {
  const box = $('caustics');
  for (let i = 0; i < 9; i++) {
    const d = document.createElement('div');
    d.className = 'caustic';
    const sz = 120 + Math.random() * 260;
    d.style.width = d.style.height = sz + 'px';
    d.style.left = (Math.random() * 92 - 8) + '%';
    d.style.top = (Math.random() * 88 - 6) + '%';
    d.style.setProperty('--dx', (Math.random() * 90 - 45).toFixed(0) + 'px');
    d.style.setProperty('--dy', (Math.random() * 80 - 40).toFixed(0) + 'px');
    d.style.animationDuration = (9 + Math.random() * 9) + 's';
    d.style.animationDelay = (-Math.random() * 12) + 's';
    box.appendChild(d);
  }
}

/* 生成顶部向下张开的宽幅光锥 */
function buildBeams() {
  const box = $('beams');
  // [角度, 宽度vw, 水平偏移vw, 亮度]
  const conf = [
    [-38, 46, -7, .16], [-30, 60, -5, .24], [-22, 74, -3, .32],
    [-14, 58, -2, .26], [ -7, 82, -1, .36], [  0, 98,  0, .42],
    [  7, 82,  1, .36], [ 14, 58,  2, .26], [ 22, 74,  3, .32],
    [ 30, 60,  5, .24], [ 38, 46,  7, .16]
  ];
  conf.forEach((c, i) => {
    const d = document.createElement('div');
    d.className = 'beam';
    d.style.setProperty('--a', c[0] + 'deg');
    d.style.setProperty('--w', c[1] + 'vw');
    d.style.setProperty('--dx', c[2] + 'vw');
    d.style.setProperty('--o', c[3]);
    d.style.animationDuration = (5.5 + Math.random() * 4) + 's';
    d.style.animationDelay = (-i * 0.62) + 's';
    box.appendChild(d);
  });
}

function init() {
  // 标题
  $('campaignTitle').textContent = CONFIG.campaign.title;
  $('campaignSub').textContent = CONFIG.campaign.subtitle;

  loadState();
  buildBeams();
  buildCaustics();
  fitAll();
  fillGroupSelect();
  renderFeed();
  renderWinners();
  renderSlotIdle();

  // 默认选中第一个未抽的奖项
  const firstPending = GROUPS.find(g => !STATE.drawn[g.id]) || GROUPS[0];
  if (firstPending) {
    $('groupSelect').value = firstPending.id;
    renderFeed();
    renderWinners();
    refreshControls();
  }

  // 事件
  $('drawBtn').onclick = runDraw;
  $('voidBtn').onclick = voidCurrent;
  $('exportBtn').onclick = exportCSV;
  $('resetBtn').onclick = resetAll;
  $('rankToggle').onclick = openRank;
  $('rankClose').onclick = closeRank;
  $('rankOverlay').onclick = e => { if (e.target.id === 'rankOverlay') closeRank(); };
  $('groupSelect').onchange = () => {
    if (busy) return;
    renderSlotIdle('等待抽奖');   // 重新选择奖项后，不显示老虎机，显示等待抽奖
    renderFeed();
    renderWinners();
    refreshControls();
  };

  window.addEventListener('resize', fitAll);

  // 空格键快捷抽奖
  window.addEventListener('keydown', e => {
    if (e.code === 'Space' && !$('drawBtn').disabled) {
      e.preventDefault();
      runDraw();
    }
  });

  requestAnimationFrame(loop);
}

init();
